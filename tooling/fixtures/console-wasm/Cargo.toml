# Consumer-level regression: the production Console and its Auth/management contracts
# must compile with embedded assets on the Workers-admitted public Core cohort.
[package]
name = "lenso-console-wasm-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
lenso = "0.5.29"
lenso-app-plan = "0.4.6"
lenso-kernel = "0.3.12"
lenso-native-adapter = "0.3.20"
lenso-capability-http-endpoint = "0.3.7"
lenso-capability-http-stream-endpoint = "0.1.4"
serde_json = "1"
lenso-console-plugin = { path = "../../../plugins/console", features = [
  "embedded-shell",
] }

[patch.crates-io]
lenso = { git = "https://github.com/LioRael/lenso", rev = "20a2f5fe184c8e1f174d38348f837bc3ea008565" }
