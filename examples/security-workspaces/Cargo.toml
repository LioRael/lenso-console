[package]
name = "lenso-security-workspaces-example"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
resolver = "2"

[package.metadata.lenso]
plugin-id = "lenso.security-workspaces.health"
root-slot = "web"

[features]
default = ["console", "browser-auth"]
console = [
  "dep:lenso-console-plugin",
  "dep:lenso-access-control-console-plugin",
  "dep:lenso-audit-log-console-plugin",
  "dep:lenso-auth-account-console-plugin",
  "dep:lenso-auth-session-console-plugin",
]
browser-auth = [
  "dep:lenso-auth-password-web-session-plugin",
  "dep:lenso-auth-session-renewal-plugin",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = "0.3"
http = "1"
lenso = "=0.5.29"
lenso-app-plan = "=0.4.6"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.20"
lenso-runner = "=0.2.20"
lenso-web-ingress-plugin = "=0.4.11"
lenso-capability-http-endpoint = "=0.3.7"
lenso-capability-http-stream-endpoint = "=0.1.4"
lenso-console-plugin = { path = "../../plugins/console", optional = true }
lenso-app-authoring = { package = "lenso-cli", version = "=0.6.5", default-features = false }
lenso-access-control-console-plugin = { path = "../../../lenso-access-control-plugin/console", optional = true }
lenso-audit-log-console-plugin = { path = "../../../lenso-audit-log-plugin/console", optional = true }
lenso-auth-account-console-plugin = { path = "../../../lenso-auth-plugin/console", optional = true }
lenso-auth-session-console-plugin = { path = "../../../lenso-auth-plugin/session-console", optional = true }
lenso-auth-password-web-session-plugin = { path = "../../../lenso-auth-plugin/adapters/password-web-session", optional = true }
lenso-auth-session-renewal-plugin = { path = "../../../lenso-auth-plugin/crates/lenso-auth-session-renewal-plugin", optional = true }
lenso-auth-account-plugin = { path = "../../../lenso-auth-plugin/crates/lenso-auth-account-plugin" }
lenso-auth-password-plugin = { path = "../../../lenso-auth-plugin/crates/lenso-auth-password-plugin" }
lenso-auth-web-session-plugin = { path = "../../../lenso-auth-plugin/crates/lenso-auth-web-session-plugin" }
lenso-auth-sdk = { path = "../../../lenso-auth-plugin/crates/lenso-auth-sdk" }
lenso-capability-auth = { path = "../../../lenso-auth-plugin/crates/lenso-capability-auth" }
lenso-access-control-postgres-plugin = { path = "../../../lenso-access-control-plugin/crates/lenso-access-control-postgres-plugin" }
lenso-audit-log-postgres-plugin = { path = "../../../lenso-audit-log-plugin/crates/lenso-audit-log-postgres-plugin" }
lenso-capability-access-control = { path = "../../../lenso-access-control-plugin/crates/lenso-capability-access-control" }
lenso-capability-access-control-directory = { path = "../../../lenso-access-control-plugin/crates/lenso-capability-access-control-directory" }
lenso-capability-audit-log = { path = "../../../lenso-audit-log-plugin/crates/lenso-capability-audit-log" }
lenso-capability-ui-contribution = { path = "../../contracts/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../../contracts/lenso-capability-workspace-service" }
lenso-secrets-env-plugin = "=0.1.7"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde_json = "1"
tokio = { version = "1.52", features = [
  "macros",
  "rt",
  "net",
  "time",
  "signal",
] }
time = "0.3"

[dev-dependencies]
tempfile = "3.27"
lenso-capability-access-control-admin = { path = "../../../lenso-access-control-plugin/crates/lenso-capability-access-control-admin" }
lenso-capability-account-admin = { path = "../../../lenso-auth-plugin/crates/lenso-capability-account-admin" }
lenso-capability-password-auth = { path = "../../../lenso-auth-plugin/crates/lenso-capability-password-auth" }
lenso-capability-credential-issuer = { path = "../../../lenso-auth-plugin/crates/lenso-capability-credential-issuer" }
lenso-capability-credential-state = { path = "../../../lenso-auth-plugin/crates/lenso-capability-credential-state" }
lenso-capability-managed-session = { path = "../../../lenso-auth-plugin/crates/lenso-capability-managed-session" }
lenso-capability-secrets = "=0.1.4"

[patch."https://github.com/LioRael/lenso-console"]
lenso-capability-ui-contribution = { path = "../../contracts/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../../contracts/lenso-capability-workspace-service" }
lenso-capability-ui-global-contribution = { path = "../../contracts/lenso-capability-ui-global-contribution" }

[patch."https://github.com/LioRael/lenso-auth-plugin"]
lenso-auth-sdk = { path = "../../../lenso-auth-plugin/crates/lenso-auth-sdk" }
lenso-capability-auth = { path = "../../../lenso-auth-plugin/crates/lenso-capability-auth" }
lenso-capability-account-admin = { path = "../../../lenso-auth-plugin/crates/lenso-capability-account-admin" }
lenso-capability-credential-issuer = { path = "../../../lenso-auth-plugin/crates/lenso-capability-credential-issuer" }
lenso-capability-credential-state = { path = "../../../lenso-auth-plugin/crates/lenso-capability-credential-state" }
lenso-capability-password-auth = { path = "../../../lenso-auth-plugin/crates/lenso-capability-password-auth" }
lenso-capability-identity-directory = { path = "../../../lenso-auth-plugin/crates/lenso-capability-identity-directory" }

[patch."https://github.com/LioRael/lenso-access-control-plugin"]
lenso-capability-access-control = { path = "../../../lenso-access-control-plugin/crates/lenso-capability-access-control" }

[lints.rust]
unsafe_code = "forbid"
