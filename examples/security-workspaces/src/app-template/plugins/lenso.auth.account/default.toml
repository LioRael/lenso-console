schema = "security_accounts"
issuer = "ordinary-app"
assertion_public_key = "REPLACE_WITH_AUTH_PUBLIC_KEY"
database_url_secret = "security.database"
assertion_signing_key_secret = "security.signing"
token_pepper_secret = "security.pepper"
assertion_ttl_seconds = 60
admin_callers = ["lenso.auth.account.console/default"]
credential_state_callers = ["lenso.auth.account.console/default"]

# Explicit finite management admission; scoped Access grants remain a separate
# operator action. The template enables reads only, never mutations.
[management_session_ceiling]
deployment = "security-workspaces"
permissions = ["auth.subject.read", "auth.session.read"]
resource_scopes = [{ kind = "app", id = "alpha" }]

[managed_sessions.policy]
idle_timeout_seconds = 1800
absolute_timeout_seconds = 43200
renew_interval_seconds = 300

[managed_sessions]
issue_callers = ["lenso.auth.password/default"]
renew_callers = ["lenso.auth.session-renewal/default"]
