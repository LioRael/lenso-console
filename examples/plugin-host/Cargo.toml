[package]
name = "lenso-console-host-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata.lenso]
plugin-id = "lenso.console.example.health"
root-slot = "web"

[features]
default = ["console"]
console = ["dep:lenso-console-plugin"]

[dependencies]
anyhow = "1"
lenso = "0.5.28"
lenso-capability-http-endpoint = "0.3.6"
lenso-console-plugin = { path = "../../plugins/console", features = [
  "embedded-shell",
], optional = true }
lenso-web-host = "0.2.5"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

[lints.rust]
unsafe_code = "forbid"
