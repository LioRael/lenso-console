[package]
name = "lenso-agent-turn-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
resolver = "2"

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.52", features = ["macros", "net"] }
tokio-stream = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
