[package]
name = "lenso-local-agent-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["process", "sync", "time", "rt"] }
toml = "0.9"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
