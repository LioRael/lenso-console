name: Rust Console roles

on:
  push:
    branches: ["codex/verify/console-role-licenses"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA
        required: true
        type: string
      mode:
        description: Dry-run by default; live publication needs approved publisher setup
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      confirmation:
        description: Type publish for authorized live publication
        required: false
        type: string

permissions: {}
concurrency:
  group: console-rust-roles
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  RELEASE_MODE: ${{ inputs.mode || 'dry-run' }}
  RELEASE_SET: '[{"package_name":"lenso-capability-ui-contribution","version":"0.1.0"},{"package_name":"lenso-capability-workspace-service","version":"0.1.0"}]'

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Check exact source, package versions and registry state
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REPOSITORY" = LioRael/lenso-console
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$CONFIRMATION" = publish
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$SOURCE_SHA"
            ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" \
              | jq -ec --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/ci.yml" and (.head_branch | startswith("codex/verify/")) and .status == "completed" and .conclusion == "success")] | sort_by([.run_number, .run_attempt]) | last // empty')
            run_id=$(jq -r .id <<<"$ci_run")
            attempt=$(jq -r .run_attempt <<<"$ci_run")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" \
              | jq -e --arg sha "$SOURCE_SHA" --argjson attempt "$attempt" '[.jobs[] | select(.name == "quality" or .name == "Native security workspaces")] as $jobs | ($jobs | length == 2) and all($jobs[]; .head_sha == $sha and .run_attempt == $attempt and .status == "completed" and .conclusion == "success")'
          fi
          cargo metadata --locked --no-deps --format-version 1 > /tmp/roles-metadata.json
          while IFS=$'\t' read -r package version; do
            jq -e --arg name "$package" --arg version "$version" 'any(.packages[]; .name == $name and .version == $version and .publish != [])' /tmp/roles-metadata.json
            status=$(curl --user-agent 'LensoConsoleRoleRelease/1.0 (https://github.com/LioRael/lenso-console)' --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/$package/$version")
            test "$status" = 404
          done < <(jq -r '.[] | [.package_name, .version] | @tsv' <<<"$RELEASE_SET")
      - name: Ordinary Cargo dry-run and verified archives
        run: |
          while IFS= read -r package; do
            cargo publish --locked --dry-run -p "$package"
            cargo package --locked -p "$package"
          done < <(jq -r '.[].package_name' <<<"$RELEASE_SET")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-rust-roles-${{ inputs.source_sha || github.sha }}
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Recheck main immediately before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$SOURCE_SHA"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish only the two approved roles and read back
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          while IFS=$'\t' read -r package version; do
            cargo package --locked -p "$package"
            checksum=$(sha256sum "target/package/$package-$version.crate" | cut -d ' ' -f 1)
            cargo publish --locked -p "$package"
            curl --user-agent 'LensoConsoleRoleRelease/1.0 (https://github.com/LioRael/lenso-console)' --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
              "https://crates.io/api/v1/crates/$package/$version" \
              | jq -e --arg version "$version" --arg checksum "$checksum" '.version.num == $version and .version.yanked == false and .version.checksum == $checksum'
          done < <(jq -r '.[] | [.package_name, .version] | @tsv' <<<"$RELEASE_SET")
