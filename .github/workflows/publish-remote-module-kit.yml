name: publish remote-module-kit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from packages/remote-module-kit/package.json
        required: true
        type: string
      dry_run:
        default: false
        description: Run every publish check without uploading to npm
        required: true
        type: boolean

concurrency:
  cancel-in-progress: false
  group: publish-remote-module-kit

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    defaults:
      run:
        working-directory: lenso-runtime-console
    steps:
      - name: Checkout Runtime Console
        uses: actions/checkout@v6
        with:
          path: lenso-runtime-console

      - name: Checkout Lenso backend SDK
        uses: actions/checkout@v6
        with:
          path: lenso
          repository: LioRael/lenso
          ssh-key: ${{ secrets.LENSO_REPO_DEPLOY_KEY }}
      - name: Checkout auth console package
        uses: actions/checkout@v6
        with:
          path: lenso-auth-module
          repository: LioRael/lenso-auth-module

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: lenso-runtime-console/package.json
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Verify publish input
        run: |
          input="${{ inputs.version }}"
          package_dir="packages/remote-module-kit"
          package_name="@lenso/remote-module-kit"
          package_version="${input}"

          if [[ "${input}" == runtime-console-api@* ]]; then
            package_dir="packages/console-package-api"
            package_name="@lenso/runtime-console-api"
            package_version="${input#runtime-console-api@}"
          fi

          if [ "${package_name}" = "@lenso/remote-module-kit" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Publish workflow must run from main, got ${GITHUB_REF}."
            exit 1
          fi

          manifest_version="$(node -p "require('./${package_dir}/package.json').version")"
          if [ "${manifest_version}" != "${package_version}" ]; then
            echo "Input version ${package_version} does not match package.json version ${manifest_version}."
            exit 1
          fi

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published."
            exit 1
          fi

          echo "PACKAGE_DIR=${package_dir}" >> "${GITHUB_ENV}"
          echo "PACKAGE_NAME=${package_name}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Run package readiness
        if: ${{ env.PACKAGE_NAME == '@lenso/remote-module-kit' }}
        run: pnpm package-readiness

      - name: Check runtime console API package
        if: ${{ env.PACKAGE_NAME == '@lenso/runtime-console-api' }}
        run: |
          pnpm --filter @lenso/runtime-console-api build
          pnpm exec vitest run packages/console-package-api/src
          cd packages/console-package-api
          npm pack --dry-run --json

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        run: |
          cd "${PACKAGE_DIR}"
          npm publish --access public --dry-run

      - name: Publish to npm with token
        if: ${{ !inputs.dry_run && env.HAS_NPM_TOKEN == 'true' }}
        run: |
          cd "${PACKAGE_DIR}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm with trusted publishing
        if: ${{ !inputs.dry_run && env.HAS_NPM_TOKEN != 'true' }}
        run: |
          cd "${PACKAGE_DIR}"
          npm publish --access public
