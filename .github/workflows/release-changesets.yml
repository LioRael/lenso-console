name: Changesets

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact landed source SHA to inspect (40 hexadecimal characters)
        required: true
        type: string
      mode:
        description: Read-only release inspection mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-dry-run:
    name: Inspect Console release changesets
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require an immutable source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Checkout the requested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the landed source revision on current main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA,,}"
          git fetch origin main --no-tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check pending release intent without changing files
        run: bun run changeset status
