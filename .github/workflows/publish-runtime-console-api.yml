name: publish runtime-console-api

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from packages/console-package-api/package.json
        required: true
        type: string
      dry_run:
        default: false
        description: Run every publish check without uploading to npm
        required: true
        type: boolean

concurrency:
  cancel-in-progress: false
  group: publish-runtime-console-api

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lenso-runtime-console
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout Runtime Console
        uses: actions/checkout@v6
        with:
          path: lenso-runtime-console

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: lenso-runtime-console/package.json
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publish input
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Publish workflow must run from main, got ${GITHUB_REF}."
            exit 1
          fi

          package_version="$(node -p "require('./packages/console-package-api/package.json').version")"
          if [ "${package_version}" != "${{ inputs.version }}" ]; then
            echo "Input version ${{ inputs.version }} does not match package.json version ${package_version}."
            exit 1
          fi

          if npm view "@lenso/runtime-console-api@${package_version}" version >/dev/null 2>&1; then
            echo "@lenso/runtime-console-api@${package_version} is already published."
            exit 1
          fi

      - name: Build package
        run: pnpm --filter @lenso/runtime-console-api build

      - name: Dry-run npm pack
        working-directory: lenso-runtime-console/packages/console-package-api
        run: npm pack --dry-run --registry https://registry.npmjs.org/

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        working-directory: lenso-runtime-console/packages/console-package-api
        run: npm publish --access public --dry-run --registry https://registry.npmjs.org/

      - name: Publish to npm with token
        if: ${{ !inputs.dry_run && env.HAS_NPM_TOKEN == 'true' }}
        working-directory: lenso-runtime-console/packages/console-package-api
        run: npm publish --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm with trusted publishing
        if: ${{ !inputs.dry_run && env.HAS_NPM_TOKEN != 'true' }}
        working-directory: lenso-runtime-console/packages/console-package-api
        run: npm publish --access public --registry https://registry.npmjs.org/
