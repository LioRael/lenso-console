name: Marketplace Workers
on:
  pull_request:
    paths:
      - "plugins/marketplace/**"
      - ".github/workflows/marketplace-workers.yml"
  push:
    branches: [main]
    paths:
      - "plugins/marketplace/**"
      - ".github/workflows/marketplace-workers.yml"
permissions:
  contents: read
jobs:
  event-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LioRael/lenso-runtime-rust
          ref: 905a59141ca0e349b734fb7de99d010f2b0dc0df
          path: .ci/runtime
      - name: Install reviewed Runtime package
        run: npm install --ignore-scripts --no-save --package-lock=false --prefix plugins/marketplace/workers "$GITHUB_WORKSPACE/.ci/runtime/packages/workers-runtime"
      - name: Build Marketplace assets
        run: |
          pnpm install --frozen-lockfile
          pnpm marketplace:build
      - name: Check composed Wasm host
        run: cargo clippy --locked --manifest-path plugins/marketplace/workers/Cargo.toml --target wasm32-unknown-unknown --workspace -- -D warnings
      - name: Check request-owned storage boundaries
        run: node --test plugins/marketplace/workers/storage.test.mjs plugins/marketplace/workers/storage-scope.test.mjs
