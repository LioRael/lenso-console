name: Publish reviewed release
run-name: lenso-publish-requested:${{ inputs.event_id }}
on:
  workflow_dispatch:
    inputs:
      event_id: { required: true, type: string }
      plan_id: { required: true, type: string }
      plan_sha256: { required: true, type: string }
      release_commit: { required: true, type: string }
      packages_json: { required: true, type: string }
      nonce: { required: true, type: string }
permissions: {}
concurrency:
  group: lenso-publish-${{ inputs.plan_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: contains(inputs.packages_json, 'npm:')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Select npm packages
        id: selection
        env:
          PACKAGES_JSON: ${{ inputs.packages_json }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packages = JSON.parse(process.env.PACKAGES_JSON);
          if (!Array.isArray(packages) || packages.some(({ id }) => !id.startsWith('npm:') && id !== 'artifact:lenso-runtime-console')) {
            throw new Error('Runtime Console publish selection contains an unsupported component');
          }
          const selected = packages.filter(({ id }) => id.startsWith('npm:'));
          if (selected.length === 0) throw new Error('npm publish job has no npm package');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(selected)}\n`);
          NODE
      - uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b
        id: app
        with:
          app-id: ${{ vars.LENSO_RELEASE_APP_ID }}
          private-key: ${{ secrets.LENSO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install reviewed publishing toolchains
        run: |
          corepack enable
          npm install --global npm@11.7.0
          pnpm install --frozen-lockfile
      - name: Complete fail-closed preflight before any registry OIDC
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ steps.selection.outputs.packages }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_COORDINATOR_PREFLIGHT_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_URL }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js preflight
      - name: Atomically consume proof and seal exact registry artifacts
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ steps.selection.outputs.packages }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL }}
          LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY: ${{ vars.LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js consume-preflight
      - name: Publish and confirm receipts
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ steps.selection.outputs.packages }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_ID: ${{ vars.LENSO_RELEASE_APP_ID }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_COORDINATOR_RECEIPT_URL: ${{ vars.LENSO_COORDINATOR_RECEIPT_URL }}
          LENSO_COORDINATOR_CLEANUP_URL: ${{ vars.LENSO_COORDINATOR_CLEANUP_URL }}
          LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL }}
          LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY: ${{ vars.LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js publish
  hosted-console-shadow:
    if: contains(inputs.packages_json, 'artifact:lenso-runtime-console')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify exact hosted Console execution ref
        env:
          PACKAGES_JSON: ${{ inputs.packages_json }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          test "$GITHUB_REF_NAME" = "release-execution/${PLAN_ID#sha256:}"
          node - <<'NODE'
          const packages = JSON.parse(process.env.PACKAGES_JSON);
          const artifacts = packages.filter(({ id }) => id === 'artifact:lenso-runtime-console');
          if (artifacts.length !== 1 || packages.some(({ id }) => !id.startsWith('npm:') && id !== 'artifact:lenso-runtime-console')) {
            throw new Error('hosted Console shadow requires exactly one supported artifact');
          }
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(artifacts[0]?.version ?? '')) {
            throw new Error('hosted Console shadow version must be exact SemVer');
          }
          NODE
      - name: Build exact hosted Console archive
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          LENSO_CONSOLE_BASE=/console/ pnpm build:local
          pnpm package:hosted-console
          sha256sum --check dist/release/lenso-runtime-console.tar.gz.sha256
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: untrusted-hosted-console-shadow-${{ inputs.plan_id }}
          path: |
            dist/release/lenso-runtime-console.tar.gz
            dist/release/lenso-runtime-console.tar.gz.sha256
          if-no-files-found: error
