name: Console development Host matrix
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified development kits as a GitHub prerelease
        required: false
        default: false
        type: boolean
      engine_repository:
        description: Repository containing the independently delivered Engine workspace
        required: true
        type: string
      engine_revision:
        description: Exact reviewed Engine commit SHA (40 hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: console
      - name: Require an immutable Engine revision
        env:
          ENGINE_REVISION: ${{ inputs.engine_revision || 'c23bdd0bda1345bb4ba80e7318c772baab85c40f' }}
        run: '[[ "$ENGINE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.engine_repository || 'LioRael/lenso-engine' }}
          ref: ${{ inputs.engine_revision || 'c23bdd0bda1345bb4ba80e7318c772baab85c40f' }}
          path: engine
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: console/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Install Bun producer tool
        run: npm install --global bun@1.3.10
      - name: Build Engine
        working-directory: engine
        run: cargo build --locked --release -p lenso-engine-host
      - name: Build Console seed
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm service:web-build
          ../engine/target/release/lenso-engine-host app build --root examples/app-console --out .artifacts/seed
      - name: Package and verify with no Rust tools on PATH
        working-directory: console
        run: |
          node scripts/package-development-host.mjs --engine-host ../engine/target/release/lenso-engine-host --host-distribution .artifacts/seed --out .artifacts/development-host
          LENSO_CONSOLE_DEV_KIT="$PWD/.artifacts/development-host" node --test scripts/distribution/development-host.test.mjs
      - name: Archive executable kit and verify the extracted download
        working-directory: console
        run: |
          target=$(node -p 'JSON.parse(require("fs").readFileSync(".artifacts/development-host/host.json", "utf8")).target')
          archive="console-development-host-$target.tar.gz"
          mkdir -p .artifacts/downloads .artifacts/extracted
          tar -czf ".artifacts/downloads/$archive" -C .artifacts development-host
          (cd .artifacts/downloads && shasum -a 256 "$archive" > "$archive.sha256")
          tar -xzf ".artifacts/downloads/$archive" -C .artifacts/extracted
          LENSO_CONSOLE_DEV_KIT="$PWD/.artifacts/extracted/development-host" node --test scripts/distribution/development-host.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-development-host-${{ matrix.os }}
          path: console/.artifacts/downloads/*
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: console-development-host-*
          merge-multiple: true
          path: downloads
      - name: Publish the verified development kit archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENGINE_REVISION: ${{ inputs.engine_revision }}
        run: |
          cd downloads
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          tag="console-dev-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          printf 'Console development kits.\n\nConsole source: %s\nEngine source: %s\n\nBoth archives passed the extracted-kit no-Rust acceptance tests. Requires a compatible macOS arm64 or Linux x64 system; these are development hosts.\n' "$GITHUB_SHA" "$ENGINE_REVISION" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Console development kit ${GITHUB_SHA:0:12}" --notes-file notes.md ./*.tar.gz ./*.sha256
