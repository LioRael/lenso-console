name: Console development Host matrix
on:
  push:
    branches:
      - "delta/verify/**"
      - "codex/verify/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified development kits as a GitHub prerelease
        required: false
        default: false
        type: boolean
      engine_repository:
        description: Repository containing the qualified unified Core workspace
        required: true
        default: LioRael/lenso
        type: string
      engine_revision:
        description: Exact reviewed and CI-qualified Core SHA (40 hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    env:
      CORE_REPOSITORY: ${{ inputs.engine_repository || 'LioRael/lenso' }}
      # Core CI36967049756: quality and bun-conformance passed this exact SHA.
      CORE_REVISION: ${{ inputs.engine_revision || 'eaa5bc489e8f8d245fd30821b4a4fbe1a9e35551' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: console
      - name: Require an immutable qualified Core revision
        run: |
          [[ "$CORE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Supply the final owner-qualified Core SHA before building a kit.' >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REVISION }}
          path: core
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: console/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: console/.node-version
      - name: Read the pinned Rust channel
        id: rust-channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' console/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
      - name: Install Bun producer tool
        run: |
          npm install --global bun@1.4.2
          test "$(bun --version)" = 1.4.2
      - name: Check native facility source before compiling
        working-directory: console
        run: |
          python3 .github/scripts/test-development-host-source.py
          python3 .github/scripts/check-development-host-source.py facility --core ../core --record .artifacts/declared-framework-source.json
      - name: Build Core producer
        working-directory: core
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/console-core-producer
          CORE_PRODUCER: ${{ runner.temp }}/console-core-producer/release/lenso-engine-host
        run: |
          cargo build --locked --release -p lenso-engine-host
          "$CORE_PRODUCER" --engine-host-info
      - name: Build Console seed
        working-directory: console
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/console-native-seed
          CORE_PRODUCER: ${{ runner.temp }}/console-core-producer/release/lenso-engine-host
        run: |
          pnpm install --frozen-lockfile
          pnpm service:web-build
          cargo check --locked --manifest-path packages/console-support/Cargo.toml
          "$CORE_PRODUCER" app build --root examples/app-console --out .artifacts/seed
      - name: Package and verify with no Rust tools on PATH
        working-directory: console
        env:
          CORE_PRODUCER: ${{ runner.temp }}/console-core-producer/release/lenso-engine-host
        run: |
          node tooling/package-development-host.mjs --engine-host "$CORE_PRODUCER" --host-distribution .artifacts/seed --out .artifacts/development-host
          python3 .github/scripts/check-development-host-source.py runtime --core ../core --seed .artifacts/seed --kit .artifacts/development-host --record .artifacts/native-runtime-sources.json
          git diff --exit-code
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const command = (program, args) => execFileSync(program, args, { encoding: "utf8" }).trim();
          const hash = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const core = command("git", ["-C", "../core", "rev-parse", "HEAD"]);
          assert.equal(core, process.env.CORE_REVISION.toLowerCase());
          const manifest = JSON.parse(fs.readFileSync(".artifacts/development-host/host.json", "utf8"));
          fs.writeFileSync(".artifacts/development-host/build-provenance.json", JSON.stringify({
            schema: "lenso.console-development-host-build.v1",
            console_sha: command("git", ["rev-parse", "HEAD"]),
            engine_repository: process.env.CORE_REPOSITORY,
            engine_sha: core,
            producer_sha256: hash(process.env.CORE_PRODUCER),
            native_host_sha256: hash(".artifacts/development-host/console-host"),
            bun_sha256: hash(".artifacts/development-host/bin/bun"),
            root_lock_sha256: hash("Cargo.lock"),
            support_lock_sha256: hash("packages/console-support/Cargo.lock"),
            seed_lock_sha256: hash(".artifacts/seed/.lenso/distribution.lock.json"),
            generated_host_lock_sha256: hash(".artifacts/development-host/build-inputs/generated-host/Cargo.lock"),
            runtime_sources_sha256: hash(".artifacts/development-host/build-inputs/native-runtime-sources.json"),
            target: manifest.target,
            node: process.version,
            bun: command("bun", ["--version"]),
            rust: command("rustc", ["--version"])
          }, null, 2));
          NODE
          LENSO_CONSOLE_DEV_KIT="$PWD/.artifacts/development-host" node --test tooling/distribution/development-host.test.mjs
      - name: Archive executable kit and verify the extracted download
        working-directory: console
        run: |
          set -euo pipefail
          target=$(node -p 'JSON.parse(require("fs").readFileSync(".artifacts/development-host/host.json", "utf8")).target')
          archive="console-development-host-$target.tar.gz"
          mkdir -p .artifacts/downloads .artifacts/extracted
          tar -czf ".artifacts/downloads/$archive" -C .artifacts development-host
          (cd .artifacts/downloads && shasum -a 256 "$archive" > "$archive.sha256")
          (cd .artifacts/downloads && shasum -a 256 --check "$archive.sha256")
          tar -xzf ".artifacts/downloads/$archive" -C .artifacts/extracted
          kit="$PWD/.artifacts/extracted/development-host"
          consumer_test="$PWD/tooling/distribution/development-host.test.mjs"
          consumer_trace="$PWD/.github/scripts/trace-development-host.mjs"
          consumer="$(mktemp -d "${RUNNER_TEMP}/console-dev-consumer.XXXXXX")"
          consumer="$(cd -- "$consumer" && pwd -P)"
          trap 'rm -rf -- "$consumer"' EXIT
          mkdir -p "$consumer/home" "$consumer/npm-cache" "$consumer/bun-cache"
          (
            cd "$consumer"
            for services in 0 1; do
              env HOME="$consumer/home" npm_config_cache="$consumer/npm-cache" \
                BUN_INSTALL_CACHE_DIR="$consumer/bun-cache" \
                LENSO_CONSOLE_DEV_KIT="$kit" LENSO_CONSOLE_DEV_KIT_SERVICES="$services" \
                node --import "$consumer_trace" --test "$consumer_test"
            done
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: console-native-build-inputs-${{ matrix.os }}
          path: |
            console/.artifacts/declared-framework-source.json
            console/.artifacts/native-runtime-sources.json
            console/.artifacts/seed/.lenso/generated-host/
            console/.artifacts/seed/.lenso/distribution.lock.json
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Preserve the exact built kit when a consumer fails; publish still
        # requires both verify jobs to succeed.
        if: ${{ !cancelled() }}
        with:
          name: console-development-host-${{ matrix.os }}
          path: console/.artifacts/downloads/*
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: console-development-host-*
          merge-multiple: true
          path: downloads
      - name: Publish the verified development kit archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENGINE_REVISION: ${{ inputs.engine_revision }}
        run: |
          cd downloads
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          tag="console-dev-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          printf 'Console development kits.\n\nConsole source: %s\nEngine source: %s\n\nBoth archives passed the extracted-kit no-Rust acceptance tests. Requires a compatible macOS arm64 or Linux x64 system; these are development hosts.\n' "$GITHUB_SHA" "$ENGINE_REVISION" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Console development kit ${GITHUB_SHA:0:12}" --notes-file notes.md ./*.tar.gz ./*.sha256
