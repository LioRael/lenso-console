name: Console development Host matrix
on:
  pull_request:
  workflow_dispatch:
    inputs:
      engine_repository:
        description: Repository containing the independently delivered Engine workspace
        required: true
        type: string
      engine_revision:
        description: Exact reviewed Engine commit SHA (40 hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: console
      - name: Require an immutable Engine revision
        env:
          ENGINE_REVISION: ${{ inputs.engine_revision || '81cff04f397c315eac0aeb9b9bdc107dc4aa1423' }}
        run: '[[ "$ENGINE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.engine_repository || 'LioRael/lenso-engine' }}
          ref: ${{ inputs.engine_revision || '81cff04f397c315eac0aeb9b9bdc107dc4aa1423' }}
          path: engine
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: console/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Install Bun producer tool
        run: npm install --global bun@1.3.10
      - name: Build Engine
        working-directory: engine
        run: cargo build --locked --release -p lenso-engine-host
      - name: Build Console seed
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm service:web-build
          ../engine/target/release/lenso-engine-host app build --root examples/app-console --out .artifacts/seed
      - name: Package and verify with no Rust tools on PATH
        working-directory: console
        run: |
          node scripts/package-development-host.mjs --engine-host ../engine/target/release/lenso-engine-host --host-distribution .artifacts/seed --out .artifacts/development-host
          LENSO_CONSOLE_DEV_KIT="$PWD/.artifacts/development-host" node --test scripts/distribution/development-host.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-development-host-${{ matrix.os }}
          path: console/.artifacts/development-host
