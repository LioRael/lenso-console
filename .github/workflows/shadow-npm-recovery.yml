name: Recover npm Shadow fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d349cc73d7b3c1c0a0f20ebb8ec886714da210ff
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: ${{ vars.LENSO_SHADOW_NPM_REGISTRY_URL }}
      - name: Reproduce and seed the exact failed-plan artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LENSO_SHADOW_NPM_TOKEN }}
          REGISTRY: ${{ vars.LENSO_SHADOW_NPM_REGISTRY_URL }}
        run: |
          corepack enable
          npm install --global npm@11.7.0 --registry https://registry.npmjs.org/
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
          pnpm install --frozen-lockfile
          pnpm --filter @lenso/runtime-console-api build
          pnpm --filter @lenso/remote-module-kit build
          pnpm --filter @lenso/service-kit build
          unset NPM_CONFIG_REGISTRY
          npm pack "$PWD/packages/remote-module-kit" --json --ignore-scripts
          npm publish "$PWD/lenso-remote-module-kit-0.1.4.tgz" --registry "$REGISTRY" --access public --ignore-scripts
