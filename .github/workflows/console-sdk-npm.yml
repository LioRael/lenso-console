name: Console npm distribution

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Console source commit (40 hexadecimal characters)
        type: string
        required: true
      publish:
        description: Publish the verified public Console archives through npm Trusted Publishing
        type: boolean
        default: false
        required: true
      package_scope:
        description: Explicit package set to verify and publish
        type: choice
        default: frontend
        required: true
        options:
          - frontend
          - backend
permissions:
  contents: read
concurrency:
  group: console-npm
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify the exact main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install disposable PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Check the exact public archives in isolated applications
        env:
          LENSO_REQUIRE_POSTGRES: "1"
        run: |
          bun install --frozen-lockfile
          bun run check
          bun tooling/distribution/console-npm.mjs pack .artifacts/console-npm
          bun tooling/distribution/console-npm.mjs verify .artifacts/console-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-npm
          path: .artifacts/console-npm/*
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PROTECTED_JOB: npm
      RELEASE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: console-npm
          path: .artifacts/console-npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Use pinned npm without a fallback token
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/console.npmrc"
          printf '\n' > "$NPM_CONFIG_USERCONFIG"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          npm install --global npm@12.2.0 --ignore-scripts
          test "$(npm --version)" = 12.2.0
      - name: Publish only the verified archives
        run: node tooling/distribution/console-npm.mjs publish .artifacts/console-npm
