name: publish hosted console

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime Console version from package.json
        required: true
        type: string
      dry_run:
        default: false
        description: Build and package without creating the GitHub Release
        required: true
        type: boolean
      recover_existing_draft:
        default: false
        description: Publish and attest an exact draft created by the reviewed publisher
        required: true
        type: boolean
      release_commit:
        default: ""
        description: Exact reviewed release commit for draft recovery
        required: false
        type: string
      expected_sha256:
        default: ""
        description: Exact reviewed hosted-console archive SHA-256 for draft recovery
        required: false
        type: string

concurrency:
  cancel-in-progress: false
  group: publish-hosted-console

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lenso-runtime-console
    steps:
      - name: Checkout Runtime Console
        uses: actions/checkout@v6
        with:
          path: lenso-runtime-console

      - name: Checkout Lenso backend SDK
        uses: actions/checkout@v6
        with:
          path: lenso
          repository: LioRael/lenso
          ssh-key: ${{ secrets.LENSO_REPO_DEPLOY_KEY }}

      - name: Checkout auth console package
        uses: actions/checkout@v6
        with:
          path: lenso-auth-module
          repository: LioRael/lenso-auth-module

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: lenso-runtime-console/package.json
          run_install: false

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: lenso-runtime-console/pnpm-lock.yaml
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publish input
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Publish workflow must run from main, got ${GITHUB_REF}."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "${package_version}" != "${{ inputs.version }}" ]; then
            echo "Input version ${{ inputs.version }} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Build hosted console
        run: LENSO_CONSOLE_BASE=/console/ pnpm build:local

      - name: Package hosted console
        env:
          LENSO_RUNTIME_CONSOLE_VERSION: ${{ inputs.version }}
        run: pnpm package:hosted-console

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: lenso-runtime-console-${{ inputs.version }}
          path: |
            lenso-runtime-console/dist/release/lenso-runtime-console.tar.gz
            lenso-runtime-console/dist/release/lenso-runtime-console.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run && !inputs.recover_existing_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lenso Runtime Console ${{ inputs.version }}" \
            --notes "Hosted Runtime Console artifact for \`lenso console update --console-version v${{ inputs.version }}\`." \
            dist/release/lenso-runtime-console.tar.gz \
            dist/release/lenso-runtime-console.tar.gz.sha256

      - name: Recover exact reviewed draft
        if: ${{ !inputs.dry_run && inputs.recover_existing_draft }}
        env:
          EXPECTED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$EXPECTED_RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Draft recovery requires an exact release commit."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Draft recovery requires an exact archive SHA-256."
            exit 1
          fi
          git merge-base --is-ancestor "$EXPECTED_RELEASE_COMMIT" HEAD

          archive=dist/release/lenso-runtime-console.tar.gz
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v${{ inputs.version }}")"
          test "$(jq -r '.draft' <<<"$release_json")" = true
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$EXPECTED_RELEASE_COMMIT"
          release_id="$(jq -r '.id' <<<"$release_json")"

          for name in lenso-runtime-console.tar.gz lenso-runtime-console.tar.gz.sha256; do
            local_path="dist/release/$name"
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
            test -n "$asset_id"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "/tmp/$name"
            cmp "$local_path" "/tmp/$name"
          done

          gh attestation sign "$archive" --repo "$GITHUB_REPOSITORY"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=false >/dev/null
