name: Verify production zero-write failure
run-name: verify-production-zero-write-failure:${{ inputs.plan_id }}:${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      plan_id:
        { description: Exact reviewed plan ID, required: true, type: string }
      release_commit:
        {
          description: Exact reviewed release commit,
          required: true,
          type: string,
        }
      event_id:
        {
          description: Exact coordinator publisher event ID,
          required: true,
          type: string,
        }
      failed_run_id:
        {
          description: Exact failed publisher run ID,
          required: true,
          type: string,
        }

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: verify-production-zero-write-failure-${{ inputs.plan_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed release commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Verify proof consumption and npm authentication failure
        env:
          EVENT_ID: ${{ inputs.event_id }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ inputs.plan_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -r .planId .lenso-release/plan.json)" = "$PLAN_ID"
          jq -e '
            .packages | length == 2 and
            any(.id == "npm:@lenso/console-package-api" and .nextVersion == "0.1.2") and
            any(.id == "oci:lenso-console-service" and .nextVersion == "0.1.4")
          ' .lenso-release/plan.json

          run_json="$(mktemp)"
          jobs_json="$(mktemp)"
          failed_log="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" > "$run_json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs" > "$jobs_json"
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$failed_log"
          jq -e \
            --arg commit "$RELEASE_COMMIT" \
            --arg event_id "$EVENT_ID" \
            --arg plan_id "$PLAN_ID" '
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $commit and
              .head_branch == ("release-execution/" + ($plan_id | sub("^sha256:"; ""))) and
              .path == ".github/workflows/publish.yml" and
              .display_title == ("lenso-publish-requested:" + $event_id)
            ' "$run_json"
          jq -e '
            [.jobs[] | select(.name == "publish")] as $publish |
            [.jobs[] | select(.name == "recover" or .name == "recover-partial")] as $recovery |
            ($publish | length == 1) and
            ($publish[0].conclusion == "failure") and
            ($recovery | length == 2) and
            all($recovery[]; .conclusion == "skipped") and
            ($publish[0].steps | any(.name == "Complete fail-closed preflight before any registry OIDC" and .conclusion == "success")) and
            ($publish[0].steps | any(.name == "Atomically consume proof and seal exact registry artifacts" and .conclusion == "success")) and
            ($publish[0].steps | any(.name == "Attest sealed production artifacts" and .conclusion == "success")) and
            ($publish[0].steps | any(.name == "Publish and confirm receipts" and .conclusion == "failure"))
          ' "$jobs_json"
          grep -F 'npm publish ' "$failed_log" >/dev/null
          grep -F 'lenso-console-package-api-0.1.2.tgz' "$failed_log" >/dev/null
          grep -F 'npm error code ENEEDAUTH' "$failed_log" >/dev/null
          grep -F 'This command requires you to be logged in to https://registry.npmjs.org/' "$failed_log" >/dev/null
      - name: Prove the production npm version is absent
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            'https://registry.npmjs.org/%40lenso%2Fconsole-package-api/0.1.2')"
          test "$status" = 404
      - name: Prove the production OCI manifest is absent
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          token_response="$(mktemp)"
          manifest_response="$(mktemp)"
          token_status="$(curl --silent --show-error --output "$token_response" --write-out '%{http_code}' \
            --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get 'https://ghcr.io/token' \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:liorael/lenso-console:pull')"
          test "$token_status" = 200
          registry_token="$(jq -er .token "$token_response")"
          manifest_status="$(curl --silent --show-error --output "$manifest_response" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            --header "Authorization: Bearer ${registry_token}" \
            'https://ghcr.io/v2/liorael/lenso-console/manifests/0.1.4')"
          test "$manifest_status" = 404
          jq -e '.errors | any(.code == "MANIFEST_UNKNOWN")' "$manifest_response"
