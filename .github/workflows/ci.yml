name: ci

on:
  push:
    branches:
      - "delta/verify/**"
      - "codex/verify/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version
      - name: Install pinned Bun
        run: npm install --global "bun@$(cat .bun-version)"
      - name: Prepare immutable framework dependencies
        run: node tooling/distribution/prepare-ts-framework.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript quality gates
        run: pnpm check
