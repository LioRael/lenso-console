name: ci

on:
  push:
    branches:
      - "delta/verify/**"
      - "codex/verify/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install owner contract projection generator
        run: >-
          cargo install --locked --git https://github.com/LioRael/lenso --rev 1b34db24797c58bf756290e35f54f0b73f24af94 --version 0.10.1 lenso-contract-codegen
      - name: Run fast preflight
        run: pnpm check:preflight
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run quality gates
        run: pnpm check:full
