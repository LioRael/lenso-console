name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Console
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: pnpm check

  console-service-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lenso Console
        uses: actions/checkout@v6
      - name: Build and smoke Console Service image
        run: sh scripts/console-service-container-smoke.sh
      - name: Run Console Service recovery drill
        env:
          LENSO_CONSOLE_IMAGE_VERSION: smoke
          LENSO_CONSOLE_SKIP_BUILD: "1"
        run: sh scripts/console-service-recovery-smoke.sh
