# One dependency graph for Console contracts, Plugins, runtime support and reference Host.
[workspace]
resolver = "2"
members = [
  "service",
  "service/crates/lenso-console-app",
  "service/tests/fixtures/welcome-workspace-plugin",
  "service/tests/fixtures/password-session-consumer",
  "contracts/crates/lenso-capability-ui-contribution",
  "contracts/crates/lenso-capability-ui-global-contribution",
  "contracts/crates/lenso-capability-workspace-service",
  "contracts/crates/lenso-capability-management",
  "contracts/crates/lenso-capability-management-human",
  "plugins/observe",
  "plugins/assistant",
  "plugins/observe/crates/lenso-capability-observability-query",
  "plugins/management/crates/lenso-management-core",
  "plugins/management/crates/lenso-management-authority",
  "plugins/management/crates/lenso-management-http",
  "plugins/management-mcp",
  "runtime/agent-turn-relay",
  "runtime/local-agent-launcher",
  "examples/plugin-host",
]
default-members = ["service", "service/crates/lenso-console-app"]
exclude = ["packages/console-support"]

