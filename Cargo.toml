# One dependency graph for Console contracts, Plugins, runtime support and reference Host.
[workspace]
resolver = "2"
members = [
  "plugins/console",
  "apps/reference-host",
  "plugins/console/tests/fixtures/welcome-workspace-plugin",
  "plugins/console/tests/fixtures/password-session-consumer",
  "contracts/lenso-capability-ui-contribution",
  "contracts/lenso-capability-ui-global-contribution",
  "contracts/lenso-capability-workspace-service",
  "contracts/lenso-capability-console-locale-store",
  "contracts/lenso-capability-management",
  "contracts/lenso-capability-management-human",
  "plugins/observe",
  "plugins/assistant",
  "plugins/agent-ai-adapter",
  "plugins/observe/crates/lenso-capability-observability-query",
  "plugins/management/crates/lenso-management-core",
  "plugins/management/crates/lenso-management-authority",
  "plugins/management/crates/lenso-management-http",
  "plugins/management-mcp",
  "packages/agent-turn-relay",
  "packages/local-agent-launcher",
  "examples/plugin-host",
]
default-members = ["plugins/console", "apps/reference-host"]
exclude = ["packages/console-support"]

[patch.crates-io]
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167" }
lenso-capability-projects = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-projects-admin = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-projects-collaboration = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-organization-admin = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-directory = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-membership = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-membership-admin = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-access-control = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "94b6d06cff1e6f17a06e771df232f662cae28ad5" }
lenso-capability-access-control-admin = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "94b6d06cff1e6f17a06e771df232f662cae28ad5" }
lenso-capability-access-control-directory = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "94b6d06cff1e6f17a06e771df232f662cae28ad5" }

[patch."https://github.com/LioRael/lenso-console"]
lenso-capability-ui-contribution = { path = "contracts/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "contracts/lenso-capability-workspace-service" }
