[package]
name = "lenso-marketplace-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
description = "Signed release identity and verification for the Lenso Plugin marketplace."

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
lenso-plugin-bundle = "0.4.1"
lenso-app-authoring = { package = "lenso-cli", version = "0.5.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
