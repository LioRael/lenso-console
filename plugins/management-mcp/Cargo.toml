[package]
name = "lenso-management-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
description = "Opt-in MCP Streamable HTTP server over one bound Management Capability."

[package.metadata.lenso]
plugin-id = "lenso.console.management-mcp"
root-slot = "management-mcp"

[dependencies]
lenso = "0.5.29"
lenso-native-adapter-macros = "=0.2.9"
lenso-capability-http-stream-endpoint = "0.1.4"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
http = "1"
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167" }
lenso-capability-management = { path = "../../contracts/lenso-capability-management", version = "0.1.0" }
lenso-kernel = "0.3.12"
rmcp = { version = "=3.5.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
lenso-runner = "0.2.20"
lenso-app-plan = "0.4.6"
lenso-native-adapter = "0.3.20"
rmcp = { version = "=3.5.0", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["macros", "net"] }

[lints.rust]
unsafe_code = "forbid"
