[package]
name = "lenso-management-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
description = "Opt-in MCP Streamable HTTP server over one bound Management Capability."

[workspace]

[dependencies]
axum = "0.8"
http = "1"
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
lenso-capability-management = { path = "../../contracts/crates/lenso-capability-management", version = "0.1.0" }
lenso-kernel = "0.3.12"
rmcp = { version = "=3.5.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
lenso-app-plan = "0.4.6"
lenso-native-adapter = "0.3.19"
lenso-runner = "0.2.20"
rmcp = { version = "=3.5.0", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["macros", "net"] }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
lenso = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
lenso-agent-tool-cli-plugin = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
lenso-app-plan = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
