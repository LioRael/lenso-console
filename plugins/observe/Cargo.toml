[package]
name = "lenso-observe-plugin"
version = "0.1.0"
description = "First-party Observe Workspace Plugin for Lenso Console."
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.workspace.observe"
root-slot = "console-workspaces"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
futures = "0.3"
flate2 = "1.1"
hex = "0.4"
http = "1"
lenso = "0.5.28"
lenso-native-adapter-macros = "=0.2.8"
lenso-capability-observability-query = { path = "crates/lenso-capability-observability-query", version = "0.1.0" }
lenso-capability-http-stream-endpoint = "0.1.3"
lenso-capability-ui-contribution = { path = "../../contracts/crates/lenso-capability-ui-contribution", version = "0.1.0" }
lenso-capability-workspace-service = { path = "../../contracts/crates/lenso-capability-workspace-service", version = "0.1.0" }
lenso-kernel = "0.3.12"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
  "gen-tonic-messages",
  "logs",
  "trace",
] }
prost = "0.14.4"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync"] }
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "=0.39.0", features = ["hooks"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[workspace]
resolver = "2"
members = [".", "crates/lenso-capability-observability-query"]

[patch.crates-io]
lenso = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
lenso-agent-tool-cli-plugin = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
lenso-app-plan = { git = "https://github.com/LioRael/lenso", rev = "1b34db24797c58bf756290e35f54f0b73f24af94" }
