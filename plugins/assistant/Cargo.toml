[package]
name = "lenso-console-assistant-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Optional independently built global Console assistant UI."

[package.metadata.lenso]
plugin-id = "lenso.console.assistant"
root-slot = "console-global-extensions"

[dependencies]
lenso = "0.5.28"
lenso-kernel = "0.3.12"
lenso-native-adapter-macros = "=0.2.8"
lenso-capability-ui-global-contribution = { path = "../../contracts/crates/lenso-capability-ui-global-contribution" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
lenso-native-adapter = "0.3.19"
lenso-app-plan = "0.4.6"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
