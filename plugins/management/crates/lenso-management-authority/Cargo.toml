[package]
name = "lenso-management-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
description = "Native operators realm, current credential, qualification and security owner adapter."

[dependencies]
lenso-capability-human-api-token = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
futures = "0.3"
lenso-management-core = { path = "../lenso-management-core", version = "0.1.0" }
lenso-kernel = "0.3.11"
lenso-capability-management-human = { path = "../../../../contracts/crates/lenso-capability-management-human", version = "0.1.0" }
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
lenso-capability-credential-state = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
lenso-capability-access-control = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "62ed6b9a100242e6932a46cb369b21f1c26ab765" }
lenso-capability-business-approval = { git = "https://github.com/LioRael/lenso-business-approval-plugin", rev = "7f5530caa477bc5c7e28ae7c41e01bfd1a59969b" }
lenso-capability-audit-log = { git = "https://github.com/LioRael/lenso-audit-log-plugin", rev = "59ecc79e38de72891e6a164d7e74617c618038f8" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"
lenso-app-plan = "0.4.6"
lenso-native-adapter = "0.3.18"
lenso-runner = "0.2.19"
lenso-capability-secrets = "0.1.4"
lenso-auth-api-token-plugin = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
lenso-capability-api-token-admin = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "be751f795b254ab228ae4fb2fde7cf79a934d09b" }
lenso-access-control-postgres-plugin = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "62ed6b9a100242e6932a46cb369b21f1c26ab765" }
lenso-capability-access-control-admin = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "62ed6b9a100242e6932a46cb369b21f1c26ab765" }
lenso-capability-access-control-directory = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "62ed6b9a100242e6932a46cb369b21f1c26ab765" }
lenso-business-approval-postgres-plugin = { git = "https://github.com/LioRael/lenso-business-approval-plugin", rev = "7f5530caa477bc5c7e28ae7c41e01bfd1a59969b" }
lenso-audit-log-postgres-plugin = { git = "https://github.com/LioRael/lenso-audit-log-plugin", rev = "59ecc79e38de72891e6a164d7e74617c618038f8" }
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
