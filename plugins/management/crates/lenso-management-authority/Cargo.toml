[package]
name = "lenso-management-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
description = "Native operators realm, current credential, qualification and security owner adapter."

[dependencies]
futures = "0.3"
lenso-management-core = { path = "../lenso-management-core", version = "0.1.0" }
lenso-kernel = "0.3.11"
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "b582fde766a3c2c776f1d356d53361ecdd2d3cd4" }
lenso-capability-credential-state = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "b582fde766a3c2c776f1d356d53361ecdd2d3cd4" }
lenso-capability-access-control = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "62ed6b9a100242e6932a46cb369b21f1c26ab765" }
lenso-capability-business-approval = { git = "https://github.com/LioRael/lenso-business-approval-plugin", rev = "d1245891e02386e6ab30e2c0b7858a3a26ba7b68" }
lenso-capability-audit-log = { git = "https://github.com/LioRael/lenso-audit-log-plugin", rev = "59ecc79e38de72891e6a164d7e74617c618038f8" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
