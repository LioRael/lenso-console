[package]
name = "lenso-console-welcome-workspace-plugin"
version = "0.1.0"
description = "Reference Workspace contribution Plugin for Lenso Console."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.workspace.welcome"
root-slot = "console-workspaces"

[dependencies]
base64 = "0.22"
futures = "0.3"
lenso = "0.5.29"
lenso-capability-ui-contribution = { path = "../../../../../contracts/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../../../../../contracts/lenso-capability-workspace-service" }
lenso-kernel = "0.3.12"
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167" }
time = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
