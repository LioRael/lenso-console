[package]
name = "lenso-app-console-support"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[package.metadata.lenso]
plugin-id = "lenso.console.web"
root-slot = "console"
[[package.metadata.lenso.conventions]]
id = "lenso.console.pages"
entries = ["console"]
compiler = { program = "bun", args = [
  "../console-authoring/compiler/compiler.mjs",
], timeout_seconds = 300 }
[package.metadata.lenso-cli]
runtime = "native-linked"
[dependencies]
# The native facility declares the qualified framework source. Engine derives
# one generated Host cohort from this facade; the producer pin alone does not
# select the independently compiled Host runtime.
lenso = { version = "=0.5.29", git = "https://github.com/LioRael/lenso", rev = "eaa5bc489e8f8d245fd30821b4a4fbe1a9e35551" }
lenso-console-plugin = { path = "../../plugins/console", features = [
  "embedded-shell",
] }
