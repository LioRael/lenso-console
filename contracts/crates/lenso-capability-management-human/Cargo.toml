[package]
name = "lenso-capability-management-human"
version = "0.1.0"
description = "Human-only immutable management approval Capability."
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-console"
rust-version = "1.94"

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust-runtime"
output = "src/generated.rs"

[dependencies]
futures = "0.3"
lenso-contract-authoring = "0.1.2"
lenso-contract-runtime = "0.2.0"
lenso-guest-sdk = "0.5.1"
lenso-kernel = "=0.3.12"
lenso-plugin-authoring = "0.2.0"
lenso-runtime-codec = "=0.4.4"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
lenso-contract-authoring = "0.1.2"
lenso-contract-codegen = "=0.10.2"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
