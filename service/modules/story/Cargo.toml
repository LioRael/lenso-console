[package]
name = "lenso-module-story"
version = "0.1.20"
edition = "2024"
license = "MIT"
description = "Console-owned Runtime Story module for the Lenso Console Service."
repository = "https://github.com/LioRael/lenso-console"
homepage = "https://github.com/LioRael/lenso-console"
categories = ["web-programming", "development-tools"]
keywords = ["backend", "framework", "modules"]
rust-version = "1.94"
publish = false

[lib]
name = "story"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
lenso-service = "0.1.16"
platform-core = { package = "lenso-platform-core", version = "0.1.16" }
platform-http = { package = "lenso-platform-http", version = "0.1.15" }
platform-module = { package = "lenso-platform-module", version = "0.1.16" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "macros",
  "chrono",
  "json",
] }
tracing = "0.1"
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }

[dev-dependencies]
lenso-autonomous-service = "0.1.12"
platform-testing = { package = "lenso-platform-testing", version = "0.1.12" }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
utoipa-axum = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
# Preserve the validated Story implementation during repository extraction;
# these style-only findings predate Console ownership.
collapsible_if = "allow"
default_trait_access = "allow"
filter_next = "allow"
implicit_clone = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
