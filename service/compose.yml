name: lenso-console

x-console-environment: &console-environment
  APP_ENV: production
  CORS_ALLOWED_ORIGINS: ${CONSOLE_PUBLIC_ORIGIN:?set CONSOLE_PUBLIC_ORIGIN}
  CONSOLE_RECOVERY_MODE: ${CONSOLE_RECOVERY_MODE:?set CONSOLE_RECOVERY_MODE}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
  DATABASE_URL: ${CONSOLE_DATABASE_URL:?set CONSOLE_DATABASE_URL}
  LENSO_COMPOSITION_PROFILE: core
  LENSO_MODULE_PLATFORM_STORY_ENABLED: "false"
  LOG_FORMAT: json
  RUST_LOG: ${RUST_LOG:-info,lenso_console_service=info}
  SERVICE_NAME: lenso-console

x-console-image: &console-image
  image: lenso-console:${LENSO_CONSOLE_VERSION:-dev}
  build:
    context: ..
    dockerfile: Dockerfile

services:
  database:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=lenso_console
      - POSTGRES_PASSWORD
      - POSTGRES_USER=lenso_console
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenso_console -d lenso_console"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - console-database:/var/lib/postgresql

  migrate:
    <<: *console-image
    command: ["/usr/local/bin/lenso-console-migrate"]
    depends_on:
      database:
        condition: service_healthy
    environment: *console-environment
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  console:
    <<: *console-image
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *console-environment
    ports:
      - "${CONSOLE_HTTP_PORT:-3030}:3030"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

volumes:
  console-database:
