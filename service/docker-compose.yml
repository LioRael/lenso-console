services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lenso_console
      POSTGRES_PASSWORD: lenso_console
      POSTGRES_USER: lenso_console
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenso_console -d lenso_console"]
      interval: 5s
      timeout: 3s
      retries: 10
