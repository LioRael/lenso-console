[package]
name = "lenso-console-observe-workspace-plugin"
version = "0.1.0"
description = "First-party Observe Workspace Plugin for Lenso Console."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.workspace.observe"
root-slot = "console-workspaces"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
futures = "0.3"
flate2 = "1.1"
hex = "0.4"
http = "1"
lenso = "0.5.17"
lenso-capability-observability-query = { path = "../lenso-capability-observability-query" }
lenso-capability-http-stream-endpoint = "0.1.1"
lenso-capability-ui-contribution = { path = "../lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../lenso-capability-workspace-service" }
lenso-kernel = "0.3.6"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
  "gen-tonic-messages",
  "logs",
  "trace",
] }
prost = "0.14.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync"] }
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
