[package]
name = "lenso-console-welcome-workspace-plugin"
version = "0.1.0"
description = "Reference Workspace contribution Plugin for Lenso Console."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.workspace.welcome"
root-slot = "console-workspaces"

[dependencies]
base64 = "0.22"
futures = "0.3"
lenso = "0.5.0"
lenso-capability-ui-contribution = { path = "../lenso-capability-ui-contribution" }
lenso-kernel = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
