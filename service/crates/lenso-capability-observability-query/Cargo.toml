[package]
name = "lenso-capability-observability-query"
version = "0.1.0"
description = "Observability query Capability for Lenso Console Observe workspaces."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[dependencies]
futures = "0.3"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-plugin-authoring = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
lenso-contract-codegen = "=0.6.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
