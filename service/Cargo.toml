[package]
name = "lenso-console-service"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
members = [".", "modules/story"]
resolver = "3"

[[bin]]
name = "lenso-console-api"
path = "src/bin/api.rs"

[[bin]]
name = "lenso-console-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "lenso-console-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "lenso-console-migrate"
path = "src/bin/migrate.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1.1"
jsonschema = { version = "0.47", default-features = false }
# Console identity must stay on the Auth 0.1 line while Organization 0.1.2
# exposes Auth 0.1 types in its public API.
lenso-module-auth = { version = "0.1.13" }
lenso-module-auth-password = { version = "0.1.18" }
lenso = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247", version = "0.3.43", features = [
  "host",
] }
lenso-module-management = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247", version = "0.2.0" }
lenso-module-organization = { version = "0.1.2" }
platform-core = { package = "lenso-platform-core", version = "0.1.24" }
console-story-backend = { package = "lenso-module-story", path = "modules/story" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
] }
tokio = { version = "1.52", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tar = "0.4"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
utoipa = "5.5"

[dev-dependencies]
lenso-api = "0.1.36"
lenso-bootstrap = "0.1.33"
platform-testing = { package = "lenso-platform-testing", version = "0.1.20" }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"

[patch.crates-io]
lenso-api = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-bootstrap = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-contracts = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-module-auth = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-anonymous = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-github = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-google = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-oauth = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-oidc = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-password = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-module-auth-phone = { git = "https://github.com/LioRael/lenso-auth-module", rev = "4994f8dcd72bafb1b1236e12df9d7328fb30013f" }
lenso-platform-core = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-platform-http = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-platform-module = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-platform-runtime = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-platform-system-plane = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-platform-testing = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
lenso-service = { git = "https://github.com/LioRael/lenso", rev = "4532cf0c6501bc3db95456fa9d9b5a8916c7b247" }
