# Native ports require one Rust contract type identity in the composed App.
# Align the owner's immutable Git contracts with this distribution's contract
# workspace; these repository-relative paths work in a clean checkout.
[patch."https://github.com/LioRael/lenso-console"]
lenso-capability-ui-contribution = { path = "../contracts/crates/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../contracts/crates/lenso-capability-workspace-service" }
