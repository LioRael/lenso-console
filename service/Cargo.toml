[package]
name = "lenso-console-plugin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.web"
root-slot = "console"

[[bin]]
name = "lenso-console"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
directories = "6.0"
dotenvy = "0.15"
lenso-agent-web = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent-harness", rev = "884efbf5233f0fbb039ffc38a01943c363ff9776", default-features = false }
lenso-agent-console-plugins = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent-harness", rev = "884efbf5233f0fbb039ffc38a01943c363ff9776" }
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6bd5b88f3c6610581fcc4306c6cf356f71f7c611" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = [
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }

[dev-dependencies]
lenso-agent-host = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent-harness", rev = "884efbf5233f0fbb039ffc38a01943c363ff9776" }
serde_json = "1.0"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
