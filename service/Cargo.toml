[package]
name = "lenso-console-service"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
members = [".", "modules/story"]
resolver = "3"

[[bin]]
name = "lenso-console-api"
path = "src/bin/api.rs"

[[bin]]
name = "lenso-console-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "lenso-console-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "lenso-console-migrate"
path = "src/bin/migrate.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
flate2 = "1.1"
lenso = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77", version = "0.3.36", features = [
  "host",
] }
console-story-backend = { package = "lenso-module-story", path = "modules/story" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
tar = "0.4"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
utoipa = "5.5"

[dev-dependencies]
lenso-api = "0.1.28"
lenso-bootstrap = "0.1.27"
platform-core = { package = "lenso-platform-core", version = "0.1.20" }
platform-testing = { package = "lenso-platform-testing", version = "0.1.16" }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"

[patch.crates-io]
lenso-api = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-bootstrap = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-contracts = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-module-auth = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-anonymous = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-github = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-google = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-oauth = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-oidc = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-password = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-module-auth-phone = { git = "https://github.com/LioRael/lenso-auth-module", rev = "1a9dd0b28c7d73aee036125ed3e4e68d19acca6c" }
lenso-platform-core = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-platform-http = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-platform-module = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-platform-runtime = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-platform-testing = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
lenso-service = { git = "https://github.com/LioRael/lenso", rev = "9f56e8e84a94c80a2df14a40659057fa0672ac77" }
