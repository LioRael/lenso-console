[package]
name = "lenso-console-service"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
members = [".", "modules/story"]
resolver = "3"

[[bin]]
name = "lenso-console-api"
path = "src/bin/api.rs"

[[bin]]
name = "lenso-console-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "lenso-console-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "lenso-console-migrate"
path = "src/bin/migrate.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
lenso = { version = "0.3.33", features = ["host"] }
console-story-backend = { package = "lenso-module-story", path = "modules/story" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
] }
tokio = { version = "1.52", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
utoipa = "5.5"

[dev-dependencies]
lenso-api = "0.1.27"
lenso-bootstrap = "0.1.26"
platform-core = { package = "lenso-platform-core", version = "0.1.16" }
platform-testing = { package = "lenso-platform-testing", version = "0.1.12" }
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
