[package]
name = "lenso-console-plugin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
default-members = [".", "crates/lenso-console-app"]
members = [
  "crates/lenso-console-app",
  ".",
  "tests/fixtures/welcome-workspace-plugin",
]
resolver = "2"

[package.metadata.lenso]
plugin-id = "lenso.console.web"
root-slot = "console"

[features]
embedded-shell = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
directories = "6.0"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1"
lenso = "0.5.17"
lenso-auth-sdk = "0.2.3"
lenso-capability-auth = "0.2.0"
lenso-capability-http-endpoint = "0.3.1"
lenso-capability-http-stream-endpoint = "0.1.1"
lenso-capability-ui-contribution = { path = "../contracts/crates/lenso-capability-ui-contribution", version = "0.1.0" }
lenso-capability-workspace-service = { path = "../contracts/crates/lenso-capability-workspace-service", version = "0.1.0" }
lenso-agent-turn-relay = { path = "../runtime/agent-turn-relay", version = "0.1.0" }
lenso-local-agent-launcher = { path = "../runtime/local-agent-launcher", version = "0.1.0" }
lenso-kernel = "0.3.6"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1.52", features = [
  "macros",
  "fs",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
toml = "0.9"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
lenso-app-plan = "0.4.1"
lenso-native-adapter = "0.3.13"
lenso-runner = "0.2.13"
time = "0.3"
axum = "0.8"
tempfile = "3.27"
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[patch.crates-io]
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust", rev = "905a59141ca0e349b734fb7de99d010f2b0dc0df" }
lenso-native-adapter-macros = { git = "https://github.com/LioRael/lenso-runtime-rust", rev = "905a59141ca0e349b734fb7de99d010f2b0dc0df" }
lenso-runtime-codec = { git = "https://github.com/LioRael/lenso-runtime-rust", rev = "905a59141ca0e349b734fb7de99d010f2b0dc0df" }

lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "0d385747d6038ad5a906d80258e1f4222383c038" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "0d385747d6038ad5a906d80258e1f4222383c038" }

lenso-capability-projects = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-projects-admin = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-projects-collaboration = { git = "https://github.com/LioRael/lenso-projects-plugin", rev = "49dfff0a79faefc8e8aa8d784dbe8aa4fe3ed7b0" }
lenso-capability-organization-admin = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-directory = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-membership = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-organization-membership-admin = { git = "https://github.com/LioRael/lenso-organization-plugin", rev = "139fb47828b9ced5c8621438b166d4d2b52c7bad" }
lenso-capability-access-control = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "ca4c2ac44653b3c248867b0db63f4784de6f1b60" }
lenso-capability-access-control-admin = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "ca4c2ac44653b3c248867b0db63f4784de6f1b60" }
lenso-capability-access-control-directory = { git = "https://github.com/LioRael/lenso-access-control-plugin", rev = "ca4c2ac44653b3c248867b0db63f4784de6f1b60" }

# Native ports require one Rust contract type identity in the composed App.
# Align the owner's immutable Git contracts with this distribution's contract
# workspace; these repository-relative paths work in a clean checkout.
[patch."https://github.com/LioRael/lenso-console"]
lenso-capability-ui-contribution = { path = "../contracts/crates/lenso-capability-ui-contribution" }
lenso-capability-workspace-service = { path = "../contracts/crates/lenso-capability-workspace-service" }
