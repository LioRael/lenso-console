[package]
name = "lenso-console-plugin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.web"
root-slot = "console"

[features]
embedded-shell = []

[dependencies]
lenso-capability-ui-global-contribution = { path = "../contracts/crates/lenso-capability-ui-global-contribution", version = "0.1.0" }
lenso-capability-human-api-token = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
directories = "6.0"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1"
lenso = "0.5.28"
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
lenso-capability-access-control = "0.2.0"
lenso-capability-management-human = { path = "../contracts/crates/lenso-capability-management-human", version = "0.1.0" }
lenso-capability-management = { path = "../contracts/crates/lenso-capability-management", version = "0.1.0" }
lenso-capability-http-endpoint = "0.3.6"
lenso-capability-http-stream-endpoint = "0.1.3"
lenso-capability-ui-contribution = { path = "../contracts/crates/lenso-capability-ui-contribution", version = "0.1.0" }
lenso-capability-workspace-service = { path = "../contracts/crates/lenso-capability-workspace-service", version = "0.1.0" }
lenso-agent-turn-relay = { path = "../runtime/agent-turn-relay", version = "0.1.0" }
lenso-local-agent-launcher = { path = "../runtime/local-agent-launcher", version = "0.1.0" }
lenso-kernel = "0.3.12"
lenso-native-adapter-macros = "=0.2.8"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1.52", features = [
  "macros",
  "fs",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
time = "0.3"
toml = "0.9"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
lenso-app-plan = "0.4.6"
lenso-native-adapter = "0.3.19"
lenso-runner = "0.2.20"
time = "0.3"
axum = "0.8"
tempfile = "3.27"
tower = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
