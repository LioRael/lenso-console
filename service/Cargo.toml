[package]
name = "lenso-console-service"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[[bin]]
name = "lenso-console-api"
path = "src/bin/api.rs"

[[bin]]
name = "lenso-console-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "lenso-console-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "lenso-console-migrate"
path = "src/bin/migrate.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
lenso = { version = "0.3.33", features = ["host"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
utoipa = "5.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
