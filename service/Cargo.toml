[package]
name = "lenso-console-plugin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[package.metadata.lenso]
plugin-id = "lenso.console.web"
root-slot = "console"

[[bin]]
name = "lenso-console"
path = "src/main.rs"

[[bin]]
name = "lenso-agent-web"
path = "src/agent_main.rs"
required-features = ["agent-web"]

[features]
agent-web = ["dep:lenso-agent-default-plugins"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
directories = "6.0"
dotenvy = "0.15"
lenso-agent-web = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent", rev = "88ad5902ac2ff85cea4373f4c382557324f4386b", default-features = false }
lenso-agent-console-plugins = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent", rev = "88ad5902ac2ff85cea4373f4c382557324f4386b" }
lenso-agent-default-plugins = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent", rev = "88ad5902ac2ff85cea4373f4c382557324f4386b", optional = true }
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = [
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
] }
tower-http = { version = "0.7", features = ["fs", "limit", "set-header"] }

[dev-dependencies]
lenso-agent-host = { version = "0.1.0", git = "https://github.com/LioRael/lenso-agent", rev = "88ad5902ac2ff85cea4373f4c382557324f4386b" }
lenso-app-authoring = { package = "lenso-cli", version = "0.4.8", git = "https://github.com/LioRael/lenso-cli", rev = "1a9155b7a8309882b81ca5bde305281594b07577", default-features = false }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
